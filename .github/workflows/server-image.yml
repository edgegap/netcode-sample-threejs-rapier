# Builds the server image (server/Dockerfile) and pushes it to the Edgegap Container Registry.
# Tag = UTC time (YYYYMMDD-HHMM); use the same string as the Edgegap app version name.
#
# Repository settings (set by the repo owner, never committed):
#   secrets   EDGEGAP_REGISTRY_USERNAME, EDGEGAP_REGISTRY_TOKEN  (Edgegap dashboard > Container Registry)
#   variables EDGEGAP_REGISTRY_PROJECT                           (the <project> in registry.edgegap.com/<project>/...)
name: Server image

on:
  push:
    branches: [main]
    paths: [server/**, shared/**, package.json, package-lock.json, .github/workflows/server-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: rapier-arena-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Registry settings
        id: registry
        env:
          USERNAME: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          PROJECT: ${{ vars.EDGEGAP_REGISTRY_PROJECT }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$PROJECT" ]; then
            echo "::notice::Registry secrets/variable not set: image not pushed (see the header of this file)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tag
        if: steps.registry.outputs.ready == 'true'
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.registry.outputs.ready == 'true'
      - uses: docker/login-action@v3
        if: steps.registry.outputs.ready == 'true'
        with:
          registry: registry.edgegap.com
          username: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.registry.outputs.ready == 'true'
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          # A plain single-platform image: no provenance/SBOM attestations, which wrap the image
          # in an index that Edgegap can't pull.
          provenance: false
          sbom: false
          tags: registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
